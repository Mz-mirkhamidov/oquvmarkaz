name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against leaked service-role usage in client code
        run: |
          if grep -rE "SERVICE_ROLE" app/ components/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY reference found in app/ or components/ — this must never reach client code."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
