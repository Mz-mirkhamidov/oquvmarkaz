name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # RLS is pure Postgres, so the security suite (T6-T10, TZ §11.3/§17.1)
      # runs against a plain service container rather than needing a real
      # Supabase project — see tests/security/setup.ts.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qalqon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qalqon_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against leaked service-role usage in client code
        run: |
          if grep -rE "SERVICE_ROLE" app/ components/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY reference found in app/ or components/ — this must never reach client code."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
